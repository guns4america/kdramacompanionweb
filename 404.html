<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101016">
<title>Shared title · KDrama Companion</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 55% 15%,#38213a,#101016 70%);color:#f8edf6;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,560px);padding:38px 34px;text-align:center;background:#201b28;border:1px solid #4a3446;border-radius:24px;box-shadow:0 30px 70px #0007}
.brand{color:#ec87b0;font-weight:800;letter-spacing:.16em;font-size:.86rem}h1{font-size:clamp(1.65rem,5vw,2.5rem);line-height:1.2;margin:22px 0 12px}p{color:#d2c7d1}
a.button{display:inline-block;border-radius:999px;padding:12px 24px;margin:10px 6px;text-decoration:none;font-weight:700;background:#e56d9c;color:#161019}a.secondary{background:#39303f;color:#f8edf6}
.note{font-size:.86rem;color:#b8aab8}a{color:#efa0be}
</style>
</head>
<body>
<main>
<div class="brand">KDRAMA COMPANION</div>
<h1 id="heading">A story worth sharing</h1>
<p id="summary">Discover and track Korean dramas and movies with KDrama Companion.</p>
<div id="actions">
<a class="button" href="https://play.google.com/store/search?q=KDrama%20Companion&amp;c=apps">Find the Android app</a>
<a class="button secondary" href="/">Visit the website</a>
</div>
<p class="note" id="help">With KDrama Companion installed, verified shared links open the title directly in the app.</p>
</main>
<script>
(() => {
  const parts = location.pathname.split('/').filter(Boolean);
  if(parts.length === 2 && parts[0] === 'friend' &&
     /^KD-[A-HJ-NP-Z2-9]{10}$/.test(parts[1])) {
    document.getElementById('heading').textContent = 'You have a friend invitation';
    document.getElementById('summary').textContent =
      'Install KDrama Companion and enter this invitation code in Profile → Friends: ' + parts[1];
    document.getElementById('help').textContent =
      'Your friend request is only sent after you choose to send it. Your watchlists and ratings remain private.';
    return;
  }
  if (parts.length !== 3 || parts[0] !== 'title' ||
      !['tv', 'movie'].includes(parts[1]) || !/^\d+$/.test(parts[2]) ||
      Number(parts[2]) < 100) return;
  const kind = parts[1] === 'tv' ? 'Korean drama' : 'Korean movie';
  document.getElementById('heading').textContent = 'A ' + kind.toLowerCase() + ' was shared with you';
  document.getElementById('summary').textContent =
    'Open this title in KDrama Companion, or view its public catalog listing.';
  const catalog = document.createElement('a');
  catalog.className = 'button secondary';
  catalog.href = 'https://www.themoviedb.org/' + parts[1] + '/' + parts[2];
  catalog.textContent = 'View title on TMDB';
  catalog.rel = 'noopener noreferrer';
  document.getElementById('actions').appendChild(catalog);
})();
</script>
</body>
</html>
